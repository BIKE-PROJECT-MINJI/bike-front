name: bike-front-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. gaja-real-backend-ui-2026-04-21)"
        required: true
        type: string
      release_title:
        description: "Release title"
        required: true
        type: string
      release_api_base_url:
        description: "Release API base URL"
        required: true
        default: "http://3.35.168.38"
        type: string
      prerelease:
        description: "Create as prerelease"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'front-release-*'

permissions:
  contents: write

concurrency:
  group: bike-front-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_API_BASE_URL: ${{ github.event.inputs.release_api_base_url || 'http://3.35.168.38' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease -PreleaseApiBaseUrl=${RELEASE_API_BASE_URL}

      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "title=BIKE front release ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            ## Summary
            - Built Android release APK from merged frontend code
            - API base URL: `${{ env.RELEASE_API_BASE_URL }}`

            ## Verification
            - ./gradlew testDebugUnitTest
            - ./gradlew assembleRelease -PreleaseApiBaseUrl=${{ env.RELEASE_API_BASE_URL }}
