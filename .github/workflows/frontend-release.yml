name: bike-front-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. gaja-real-backend-ui-2026-04-21)"
        required: true
        type: string
      release_title:
        description: "Release title"
        required: true
        type: string
      release_api_base_url:
        description: "Release API base URL"
        required: true
        default: "https://api.gajabike.shop"
        type: string
      prerelease:
        description: "Create as prerelease"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'front-release-*'

permissions:
  contents: write

concurrency:
  group: bike-front-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_API_BASE_URL: ${{ github.event.inputs.release_api_base_url || 'https://api.gajabike.shop' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare release signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.BIKE_FRONT_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.BIKE_FRONT_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.BIKE_FRONT_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.BIKE_FRONT_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ] || [ -z "${RELEASE_STORE_PASSWORD}" ] || [ -z "${RELEASE_KEY_ALIAS}" ] || [ -z "${RELEASE_KEY_PASSWORD}" ]; then
            echo "Release signing secrets are incomplete; building unsigned release APK."
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > keystore/release.jks
          cat > signing.local.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${RELEASE_STORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease -PreleaseApiBaseUrl=${RELEASE_API_BASE_URL}

      - name: Resolve release APK path
        id: apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
            echo "signing=signed" >> $GITHUB_OUTPUT
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "path=app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_OUTPUT
            echo "signing=unsigned" >> $GITHUB_OUTPUT
          else
            echo "No release APK artifact found" >&2
            exit 1
          fi

      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "title=BIKE front release ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## Summary
            - Built Android release APK from merged frontend code
            - 홈, 내 정보, 코스 미리보기, 자유주행/코스 저장/공유 흐름을 현재 구조에 맞게 정리했습니다.
            - Release artifact signing mode: `${{ steps.apk.outputs.signing }}`

            ## Verification
            - ./gradlew testDebugUnitTest
            - ./gradlew assembleRelease -PreleaseApiBaseUrl=${{ env.RELEASE_API_BASE_URL }}
