plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

import java.util.Properties
import java.util.Locale

def quote = { value -> "\"${value}\"" }
def debugApiBaseUrl = providers.gradleProperty("debugApiBaseUrl").orElse("https://api.gajabike.shop").get()
def releaseApiBaseUrl = providers.gradleProperty("releaseApiBaseUrl").orElse("https://api.gajabike.shop").get()
def kakaoNativeAppKey = providers.gradleProperty("kakaoNativeAppKey").orElse("").get()

def normalizedReleaseApiBaseUrl = releaseApiBaseUrl.toLowerCase(Locale.ROOT)

if (normalizedReleaseApiBaseUrl.startsWith("http://")) {
    throw new GradleException("releaseApiBaseUrl must use HTTPS for release builds.")
}

def signingPropsFile = rootProject.file("signing.local.properties")
def signingProps = new Properties()
def hasLocalSigning = signingPropsFile.exists()

if (hasLocalSigning) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.bikeprojectminji.bikefront'
    compileSdk 35

    defaultConfig {
        applicationId "com.bikeprojectminji.bikefront"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue 'string', 'kakao_native_app_key', kakaoNativeAppKey
    }

    signingConfigs {
        if (hasLocalSigning) {
            release {
                storeFile rootProject.file(signingProps["storeFile"])
                storePassword signingProps["storePassword"]
                keyAlias signingProps["keyAlias"]
                keyPassword signingProps["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', quote(debugApiBaseUrl)
            manifestPlaceholders = [usesCleartextTraffic: "true", kakaoNativeAppKey: kakaoNativeAppKey]
        }
        release {
            buildConfigField 'String', 'API_BASE_URL', quote(releaseApiBaseUrl)
            manifestPlaceholders = [usesCleartextTraffic: normalizedReleaseApiBaseUrl.startsWith("http://") ? "true" : "false", kakaoNativeAppKey: kakaoNativeAppKey]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasLocalSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
        viewBinding true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.5'
    implementation platform('androidx.compose:compose-bom:2024.09.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.maplibre.gl:android-sdk:11.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.kakao.sdk:v2-user:2.23.4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.09.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
